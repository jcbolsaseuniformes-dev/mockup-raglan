  const r0=bust.rotation.y,py=bust.position.y;bust.rotation.y=0;bust.position.y=0;bust.updateMatrixWorld(true);
  const SP=geo.attributes.position,SS=geo.attributes._sleeve;
  GARMENTS.moletom=buildAreas({kind:'moletom',nome:'Moletom gola careca',group:gMol,mesh:m,minY:geo.boundingBox.min.y,sleeveOff:5.5,
   sleevePts:s=>{const pts=[];for(let i=0;i<SP.count;i++){const x=SP.getX(i);if(s*x<14||SS.getX(i)<.5)continue;pts.push(new THREE.Vector3(x,SP.getY(i),SP.getZ(i)))}return pts}});
  bust.rotation.y=r0;bust.position.y=py;bust.updateMatrixWorld(true);
  renderer.compile(scene,camera);
 }catch(e){console.error(e);molPromise=null;alert('Não foi possível carregar o moletom. Tente novamente.')}
 finally{ld.remove()}}
const gbtns=[...document.querySelectorAll('.gbtn')];
async function setGarment(k){if(cur.kind===k)return;
 if(!GARMENTS[k]){gbtns.forEach(b=>b.disabled=true);try{if(!molPromise)molPromise=loadMoletom();await molPromise}finally{gbtns.forEach(b=>b.disabled=false)}if(!GARMENTS[k])return}
 cur.group.visible=false;cur=GARMENTS[k];cur.group.visible=true;AREAS=cur.areas;pickables=cur.pickables;
 ground.position.y=cur.minY-H/2-0.2;document.querySelector('.brand').textContent=cur.nome;
 gbtns.forEach(b=>b.classList.toggle('sel',b.dataset.g===k));active=null;bust.updateMatrixWorld(true);setView(0);thumbsDirty=true}
gbtns.forEach(b=>b.onclick=()=>setGarment(b.dataset.g));
window.__garment=setGarment;window.__cur=()=>cur.kind;

// v13: "Salvar pedido" asks for the company name and uploads the order to the team's Pastas (no local download)
function askCompany(){return new Promise(res=>{const m=document.createElement('div');m.className='gate';m.innerHTML=`<form class="gate-box glass" autocomplete="organization"><h3>Nome da empresa</h3><p>Informe o nome da sua empresa para enviarmos o pedido.</p><input maxlength="60" placeholder="Nome da empresa" aria-label="Nome da empresa"><div class="gate-err" hidden>Informe o nome da empresa</div><div class="gate-act"><button type="button" class="gate-c">Cancelar</button><button type="submit" class="gate-ok">Salvar</button></div></form>`;
 document.body.append(m);const f=m.querySelector('form'),i=m.querySelector('input'),er=m.querySelector('.gate-err');setTimeout(()=>i.focus(),50);
 const close=v=>{m.remove();removeEventListener('keydown',k);res(v)};const k=e=>{if(e.key==='Escape')close(null)};addEventListener('keydown',k);
 m.querySelector('.gate-c').onclick=()=>close(null);m.addEventListener('mousedown',e=>{if(e.target===m)close(null)});
 f.onsubmit=e=>{e.preventDefault();const v=i.value.replace(/\s+/g,' ').trim().slice(0,60);if(!v){er.hidden=false;i.focus();return}close(v)}})}
function orderStatus(){const m=document.createElement('div');m.className='gate';m.innerHTML=`<div class="gate-box glass ord-box"><div class="ord-spin"></div><h3>Enviando pedido…</h3><p class="ord-msg">Preparando arquivos…</p><div class="ord-bar"><i></i></div></div>`;document.body.append(m);
 return{set(t,pct){m.querySelector('.ord-msg').textContent=t;if(pct!=null)m.querySelector('.ord-bar i').style.width=Math.round(pct)+'%'},
  ok(name){m.querySelector('.ord-box').innerHTML=`<div class="ord-ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></div><h3>Pedido enviado!</h3><p>Recebemos o pedido de <b></b>. Obrigado!</p><div class="gate-act"><button class="gate-ok">OK</button></div>`;m.querySelector('b').textContent=name;m.querySelector('.gate-ok').onclick=()=>m.remove()},
  fail(){m.querySelector('.ord-box').innerHTML=`<h3>Não foi possível enviar</h3><p>Verifique sua conexão e tente novamente.</p><div class="gate-act"><button class="gate-ok">OK</button></div>`;m.querySelector('.gate-ok').onclick=()=>m.remove()}}}
document.getElementById('csv').onclick=async()=>{const btn=document.getElementById('csv'),txt=document.getElementById('csvTxt');if(btn.disabled)return;
 const company=await askCompany();if(!company)return;btn.disabled=true;txt.textContent='Enviando pedido…';const st=orderStatus();
 try{const d=new Date();
  const info=`Pedido – ${cur.nome}\r\nEmpresa: ${company}\r\nModelo: ${cur.nome}\r\nData: ${d.toLocaleString('pt-BR')}\r\nCor do corpo: ${bodyColor}\r\nCor da manga (mangas e gola): ${sleeveName}\r\nÁreas com imagem: ${AREAS.filter(a=>a.mesh.material.map).map(a=>a.nome+' ('+a.w+'x'+a.h+' cm)').join(', ')||'nenhuma'}\r\n`;
  st.set('Gerando imagens do mockup…',5);
  const images=(await renderExports()).map(([n,b])=>({name:n,blob:b}));
  for(const a of AREAS)if(a.mesh.material.map&&a.srcFile){const ext=(a.srcFile.name.match(/\.[a-z0-9]{2,5}$/i)||[''])[0];images.push({name:'arte – '+a.nome+ext,blob:a.srcFile})}
  const {sendOrder}=await import('./pedido.js');
  const r=await sendOrder({company,csv:buildCSV(),info,images,onProgress:(i,n)=>st.set(`Enviando ${Math.min(i+1,n)} de ${n}…`,10+90*i/n)});
  st.ok(r.name)}
 catch(e){console.error(e);st.fail()}
 finally{btn.disabled=false;txt.textContent='Salvar pedido'}};
window.__order={askCompany};
</script>
<script type="module">
/* v13: client link (/, #/mockup) = Mockup only; team link (#/pastas...) = tabs + password.
   Convenience lock only (static site; anyone who reads this code can bypass it) — not real security.
   Only a salted SHA-256 of the password is stored here, never the password itself. */
const TEAM_HASH='bb7cd9acd974ca7e235d2e1f7e9ac2f3e45f43abe95ad7a5010985840d68db17',SALT='mockup-raglan|jcbolsas|equipe|',KEY='raglan-team-unlock';
const isTeamHash=()=>location.hash.startsWith('#/pastas');
let team=false,loaded=false;
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('');
async function loadPastas(){if(loaded)return;loaded=true;await import('./pastas.js?v=15')}
function enterTeam(){if(team)return;team=true;document.body.classList.remove('client');document.body.classList.add('team')}
function askPassword(){return new Promise(res=>{const m=document.createElement('div');m.className='gate';m.innerHTML=`<form class="gate-box glass" autocomplete="off"><div class="gate-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div><h3>Área da equipe</h3><p>Digite a senha para acessar as Pastas.</p><input type="password" placeholder="Senha" aria-label="Senha" autocomplete="current-password"><div class="gate-err" hidden>Senha incorreta</div><div class="gate-act"><button type="button" class="gate-c">Ver mockup</button><button type="submit" class="gate-ok">Entrar</button></div></form>`;
 document.body.append(m);const f=m.querySelector('form'),i=m.querySelector('input'),er=m.querySelector('.gate-err');setTimeout(()=>i.focus(),50);
 m.querySelector('.gate-c').onclick=()=>{m.remove();res(false)};
 f.onsubmit=async e=>{e.preventDefault();const h=await sha(SALT+i.value);if(h===TEAM_HASH){localStorage.setItem(KEY,h);m.remove();res(true)}else{er.hidden=false;i.select();f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake')}}})}
let asking=false;
async function check(){if(!isTeamHash()){if(!team)document.body.classList.add('client');return}
 enterTeam();if(loaded)return;
 if(localStorage.getItem(KEY)===TEAM_HASH)return loadPastas();
 if(asking)return;asking=true;document.body.classList.add('locked');const ok=await askPassword();asking=false;document.body.classList.remove('locked');
 if(ok)loadPastas();else location.hash='#/mockup'}
addEventListener('hashchange',check);check();
document.getElementById('lockBtn').onclick=()=>{localStorage.removeItem(KEY);location.hash='#/mockup';location.reload()};
window.__gate={hash:TEAM_HASH};
</script></body></html>
